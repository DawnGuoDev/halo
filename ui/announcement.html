<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
      name="viewport"
    />
    <meta content="noindex,nofollow" name="robots" />
    <title>站内公告管理 · Halo 控制台原型</title>
    <link href="/ui-assets/favicon.ico" rel="shortcut icon" type="image/x-icon" />
    <style>
      body {
        height: 100%;
        margin: 0;
        background-color: #f5f5f5;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "PingFang SC", "Microsoft YaHei",
          sans-serif;
      }

      #loader {
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        margin: auto;
        border: solid 3px #e5e5e5;
        border-top-color: #4ccba0;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 0.6s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"><div id="loader"></div></div>
    <script src="/console-src/announcement/main.ts" type="module"></script>
  </body>
</html>
